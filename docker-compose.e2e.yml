# Docker Compose for 8-shard E2E testing
# Each shard runs on a separate port (3008-3015)

x-e2e-common: &e2e-common
  build:
    context: .
    dockerfile: Dockerfile.e2e
  restart: 'no'
  environment:
    - NODE_ENV=production
    - APP_ENV=test
    - NEXT_PUBLIC_ENABLE_MSW_MOCK=true

services:
  e2e-shard-1:
    <<: *e2e-common
    container_name: gitbox-e2e-shard-1
    ports:
      - '3008:3008'
    environment:
      - PORT=3008
      - NODE_ENV=production
      - APP_ENV=test
      - NEXT_PUBLIC_ENABLE_MSW_MOCK=true
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3008',
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

