# GitHub Auto-generated Release Notes Configuration
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
      - bot
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: '🚀 Features'
      labels:
        - feat
        - feature
        - enhancement
    - title: '🐛 Bug Fixes'
      labels:
        - fix
        - bug
        - bugfix
    - title: '📚 Documentation'
      labels:
        - docs
        - documentation
    - title: '🎨 UI/UX'
      labels:
        - ui
        - ux
        - design
        - styling
    - title: '⚡ Performance'
      labels:
        - perf
        - performance
    - title: '🔧 Maintenance'
      labels:
        - chore
        - refactor
        - test
        - ci
        - build
    - title: '🔒 Security'
      labels:
        - security
    - title: '📦 Dependencies'
      labels:
        - deps
    - title: 'Other Changes'
      labels:
        - '*'
