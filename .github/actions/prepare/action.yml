name: Prepare
description: Prepares the repo for a typical CI job (Node.js + pnpm setup)

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: '26'
        # Disable package-manager caching to avoid restoring poisoned pnpm cache entries.
        package-manager-cache: false

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
