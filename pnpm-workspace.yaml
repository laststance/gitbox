onlyBuiltDependencies:
  - '@sentry/cli'
  - esbuild
  - msw
  - sharp
  - unrs-resolver

patchedDependencies:
  vite-plugin-storybook-nextjs@3.2.4: patches/vite-plugin-storybook-nextjs@3.2.4.patch

# Supply-chain security (migrated from .npmrc 2026-05-07)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next
  - react
  - react-dom
  - '@types/react'
  - '@types/react-dom'
  - typescript
  - vite
  - vitest
  - '@vitejs/plugin-react'
  - eslint
  - prettier
  - tailwindcss
  - '@tanstack/react-query'
  - zod
  - react-hook-form
  - eslint-config-ts-prefixer
  - '@laststance/redux-storage-middleware'
  - '@laststance/react-next-eslint-plugin'
verifyStoreIntegrity: true
