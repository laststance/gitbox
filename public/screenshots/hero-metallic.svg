<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="GitBox Metallic Hero Image">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f6f7" />
      <stop offset="18%" stop-color="#cfd3d6" />
      <stop offset="36%" stop-color="#8a8f95" />
      <stop offset="52%" stop-color="#f0f2f4" />
      <stop offset="70%" stop-color="#a7adb3" />
      <stop offset="100%" stop-color="#f8f9fa" />
    </linearGradient>
    <radialGradient id="highlight" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#d7dade" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9aa0a6" stop-opacity="0.2" />
    </radialGradient>
    <linearGradient id="shadow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a7f85" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0b0c0d" stop-opacity="0.2" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="12" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#0f1114" />
  <rect width="1200" height="675" fill="url(#highlight)" opacity="0.55" />

  <g opacity="0.95">
    <path d="M120 520 C260 360 460 320 600 180 C740 40 980 80 1080 220 C1160 330 1060 480 900 520 C780 550 720 620 600 620 C460 620 360 600 260 560 C200 540 160 560 120 520 Z" fill="url(#steel)" />
    <path d="M150 220 C240 140 360 120 460 160 C560 200 640 200 720 150 C820 100 940 140 1020 220 C1100 300 1040 420 920 430 C800 440 720 420 640 360 C560 300 460 280 360 300 C260 320 200 300 150 220 Z" fill="url(#steel)" />
    <path d="M240 120 C340 70 460 80 560 120 C660 160 760 150 880 110 C980 70 1080 120 1120 200 C1160 280 1100 340 980 340 C860 340 760 320 660 260 C560 200 420 200 320 220 C240 240 200 200 240 120 Z" fill="url(#shadow)" />
  </g>

  <g opacity="0.9" filter="url(#soften)">
    <ellipse cx="300" cy="420" rx="220" ry="120" fill="url(#highlight)" />
    <ellipse cx="900" cy="380" rx="240" ry="140" fill="url(#highlight)" />
  </g>

  <g opacity="0.6">
    <path d="M410 520 C520 440 680 440 780 520" stroke="#ffffff" stroke-opacity="0.6" stroke-width="6" fill="none" />
    <path d="M470 560 C560 520 640 520 730 560" stroke="#cfd3d6" stroke-opacity="0.7" stroke-width="4" fill="none" />
  </g>

  <rect width="1200" height="675" filter="url(#grain)" opacity="0.25" />
</svg>
